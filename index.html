<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Canon — A Cinephile's Watchlist</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  header {
    text-align: center;
    padding: 60px 20px 40px;
    border-bottom: 1px solid var(--border);
  }
  header::before {
    content:''; display:block;
    width:1px; height:40px;
    background:var(--gold);
    margin:0 auto 24px; opacity:0.5;
  }
  .eyebrow { font-size:10px; letter-spacing:0.4em; text-transform:uppercase; color:var(--gold); margin-bottom:16px; }
  h1 { font-family:'Cormorant Garamond',serif; font-size:clamp(48px,8vw,88px); font-weight:300; line-height:0.9; color:var(--dark); letter-spacing:-0.02em; }
  .subtitle { font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); margin-top:20px; }
  .skull-legend { display:inline-flex; align-items:center; gap:8px; margin-top:14px; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); border:1px solid var(--border); padding:6px 14px; }
  .stats-bar { display:flex; justify-content:center; flex-wrap:wrap; gap:48px; padding:24px; background:var(--dark); color:var(--cream); }
  .stat { text-align:center; }
  .stat-num { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:300; color:var(--gold-light); display:block; }
  .stat-label { font-size:9px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(245,240,232,0.4); margin-top:2px; display:block; }
  .controls { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:32px 20px 16px; }
  .filter-btn { background:none; border:1px solid var(--border); color:var(--muted); font-family:'Josefin Sans',sans-serif; font-size:10px; letter-spacing:0.25em; text-transform:uppercase; padding:8px 18px; cursor:pointer; transition:all 0.2s; }
  .filter-btn:hover, .filter-btn.active { background:var(--dark); color:var(--gold-light); border-color:var(--dark); }
  .search-wrap { display:flex; justify-content:center; padding:8px 20px 32px; }
  .search-wrap input { background:none; border:none; border-bottom:1px solid var(--border); padding:8px 0; width:320px; font-family:'Cormorant Garamond',serif; font-size:16px; font-style:italic; color:var(--ink); outline:none; text-align:center; }
  .search-wrap input::placeholder { color:var(--muted); opacity:0.6; }
  main { max-width:1200px; margin:0 auto; padding:0 24px 100px; }
  .section { margin-bottom:64px; }
  .section-header { display:flex; align-items:baseline; gap:20px; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .section-title { font-family:'Cormorant Garamond',serif; font-size:13px; font-weight:400; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); }
  .section-count { font-size:10px; letter-spacing:0.2em; color:var(--muted); }
  .films-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:2px; }
  .film-card { display:flex; align-items:flex-start; gap:14px; padding:14px 16px; background:rgba(255,255,255,0.4); cursor:pointer; transition:background 0.15s; border:1px solid transparent; }
  .film-card:hover { background:rgba(255,255,255,0.75); border-color:var(--border); }
  .film-card.watched { background:rgba(184,145,74,0.06); }
  .film-card.watched .film-title { color:var(--muted); text-decoration:line-through; text-decoration-color:var(--gold-light); opacity:0.7; }
  .checkbox { width:17px; height:17px; border:1px solid var(--border); flex-shrink:0; margin-top:3px; display:flex; align-items:center; justify-content:center; transition:all 0.15s; background:white; }
  .film-card.watched .checkbox { background:var(--gold); border-color:var(--gold); }
  .checkbox-mark { display:none; color:white; font-size:10px; }
  .film-card.watched .checkbox-mark { display:block; }
  .film-info { flex:1; min-width:0; }
  .film-title { font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:400; color:var(--dark); line-height:1.2; margin-bottom:4px; }
  .film-meta { font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .film-director { color:var(--gold); }
  .film-right { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
  .film-flag { font-size:13px; opacity:0.85; }
  .no-results { text-align:center; padding:60px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:20px; color:var(--muted); }
  .progress-bar-wrap { position:fixed; bottom:0; left:0; right:0; height:3px; background:rgba(26,20,16,0.1); z-index:100; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--red),var(--gold)); transition:width 0.4s ease; }
  @media(max-width:600px){ .stats-bar{gap:20px;} .films-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="active">The List</a>
  <a href="framework.html">The Framework</a>
</nav>
<header>
  <p class="eyebrow">A Personal Cinephile's Guide</p>
  <h1>The<br><em>Canon</em></h1>
  <p class="subtitle">~300 essential films every serious viewer should see</p>
  <div style="margin-top:14px;">
    <span class="skull-legend">💀 Demanding watch — long or formally challenging</span>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><span class="stat-num" id="total-count">0</span><span class="stat-label">Total Films</span></div>
  <div class="stat"><span class="stat-num" id="watched-count">0</span><span class="stat-label">Seen</span></div>
  <div class="stat"><span class="stat-num" id="remaining-count">0</span><span class="stat-label">Remaining</span></div>
  <div class="stat"><span class="stat-num" id="pct-count">0%</span><span class="stat-label">Complete</span></div>
</div>

<div class="controls">
  <button class="filter-btn active" data-filter="all">All Films</button>
  <button class="filter-btn" data-filter="unseen">Unseen</button>
  <button class="filter-btn" data-filter="watched">Watched</button>
  <button class="filter-btn" data-filter="french">🇫🇷 French</button>
  <button class="filter-btn" data-filter="demanding">💀 Demanding</button>
  <button class="filter-btn" data-filter="silent">Silent Era</button>
  <button class="filter-btn" data-filter="blockbuster">Culture Definers</button>
</div>

<div class="search-wrap">
  <input type="text" id="search" placeholder="Search by title or director…">
</div>

<main id="main"></main>

<div class="progress-bar-wrap">
  <div class="progress-bar" id="progress-bar" style="width:0%"></div>
</div>

<script src="data/films.js"></script>
<script>
// Deduplicate by title+year keeping first occurrence
const seenKeys = new Set();
const films = FILMS.filter(f => {
  const k = f.t + f.y;
  if (seenKeys.has(k)) return false;
  seenKeys.add(k);
  return true;
});

let watched = {};
try { watched = JSON.parse(localStorage.getItem('canon_v3') || '{}'); } catch(e) {}
function save() { try { localStorage.setItem('canon_v3', JSON.stringify(watched)); } catch(e){} }
function fid(f) { return (f.t+f.y).replace(/[^a-zA-Z0-9]/g,''); }

let filter = 'all', q = '';

function toggle(id) { watched[id] = !watched[id]; save(); render(); }

function updateStats() {
  const total = films.length;
  const w = films.filter(f => watched[fid(f)]).length;
  document.getElementById('total-count').textContent = total;
  document.getElementById('watched-count').textContent = w;
  document.getElementById('remaining-count').textContent = total - w;
  document.getElementById('pct-count').textContent = Math.round(w/total*100) + '%';
  document.getElementById('progress-bar').style.width = (w/total*100) + '%';
}

function render() {
  updateStats();
  const filtered = films.filter(f => {
    const id = fid(f);
    if (filter==='unseen' && watched[id]) return false;
    if (filter==='watched' && !watched[id]) return false;
    if (filter==='french' && !f.tags.includes('french')) return false;
    if (filter==='demanding' && !f.dem) return false;
    if (filter==='silent' && !f.tags.includes('silent')) return false;
    if (filter==='blockbuster' && !f.tags.includes('blockbuster')) return false;
    if (q) {
      const ql = q.toLowerCase();
      if (!f.t.toLowerCase().includes(ql) && !f.d.toLowerCase().includes(ql)) return false;
    }
    return true;
  });

  const sections = [...new Set(films.map(f => f.s))];
  let html = '';
  let any = false;

  for (const sec of sections) {
    const sf = filtered.filter(f => f.s === sec);
    if (!sf.length) continue;
    any = true;
    html += `<div class="section"><div class="section-header">
      <span class="section-title">${sec}</span>
      <span class="section-count">${sf.length} film${sf.length!==1?'s':''}</span>
    </div><div class="films-grid">`;
    for (const f of sf) {
      const id = fid(f);
      const w = !!watched[id];
      html += `<div class="film-card${w?' watched':''}" onclick="toggle('${id}')">
        <div class="checkbox"><span class="checkbox-mark">✓</span></div>
        <div class="film-info">
          <div class="film-title">${f.t}</div>
          <div class="film-meta"><span class="film-director">${f.d}</span><span>${f.y}</span></div>
        </div>
        <div class="film-right">
          <span class="film-flag">${flagMap[f.c]||''}</span>
          ${f.dem?'<span title="Demanding watch — long or formally challenging">💀</span>':''}
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  if (!any) html = `<p class="no-results">No films match your search.</p>`;
  document.getElementById('main').innerHTML = html;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});
document.getElementById('search').addEventListener('input', e => { q = e.target.value; render(); });
render();
</script>
</body>
</html>
